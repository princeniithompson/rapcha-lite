name: Build and publish release

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "*.md"
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK platform 36.1
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is not set}"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1 || true)"
          fi
          if [ ! -x "${SDKMANAGER:-}" ]; then
            echo "sdkmanager not found under $ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-36.1" "build-tools;36.1.0"

      - name: Bump version for this build
        run: |
          set -euo pipefail
          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          VERSION_NAME="lean-${VERSION_CODE}"
          sed -i -E "s/versionCode = [0-9]+/versionCode = ${VERSION_CODE}/" app/build.gradle.kts
          sed -i -E "s/versionName = \"[^\"]+\"/versionName = \"${VERSION_NAME}\"/" app/build.gradle.kts
          grep -nE "version(Code|Name)" app/build.gradle.kts
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"

      - name: Decode release keystore
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.RAPCHA_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/rapcha-release.jks"
          test -s "$RUNNER_TEMP/rapcha-release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/rapcha-release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon -x test -x lint

      - name: Verify APK and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXPECTED_CERT="cff21c194fe39826b5ed302c1413179add725c2660b682a964e5759a6264eb08"
          SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$SRC" ]; then
            echo "Release APK not found at $SRC"
            find app/build/outputs/apk -type f -name '*.apk' || true
            exit 1
          fi
          case "$SRC" in
            *unsigned*) echo "Refusing unsigned APK: $SRC"; exit 1 ;;
          esac
          cp "$SRC" rapcha-lite.apk

          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          APKSIGNER="$BT/apksigner"
          AAPT="$BT/aapt"
          if [ ! -x "$APKSIGNER" ] || [ ! -x "$AAPT" ]; then
            echo "apksigner or aapt missing in $BT"
            ls -la "$BT" || true
            exit 1
          fi

          "$APKSIGNER" verify --verbose rapcha-lite.apk

          CERT="$("$APKSIGNER" verify --print-certs rapcha-lite.apk | awk '/SHA-256 digest/ {
                line=$0
                sub(/.*SHA-256 digest: */, "", line)
                gsub(/[ :]/, "", line)
                print tolower(line)
                exit
              }')"
          if [ "$CERT" != "$EXPECTED_CERT" ]; then
            echo "Certificate SHA-256 mismatch: got ${CERT:-empty} expected $EXPECTED_CERT"
            "$APKSIGNER" verify --print-certs rapcha-lite.apk || true
            exit 1
          fi

          BADGING="$("$AAPT" dump badging rapcha-lite.apk)"
          echo "$BADGING" | grep -q "package: name='com.princeniithompson.rapcha'" \
            || { echo "Unexpected package name"; echo "$BADGING"; exit 1; }
          if echo "$BADGING" | grep -q "application-debuggable"; then
            echo "APK is debuggable; refusing to publish"
            exit 1
          fi
          echo "$BADGING" | grep -q "versionCode='${VERSION_CODE}'" \
            || { echo "versionCode mismatch"; echo "$BADGING"; exit 1; }

          SHA="$(sha256sum rapcha-lite.apk | awk '{print $1}')"
          SIZE="$(stat -c%s rapcha-lite.apk)"
          LINK="https://github.com/princeniithompson/rapcha-lite/releases/latest/download/rapcha-lite.apk"
          TAG="v${VERSION_CODE}"
          NOTES="$(cat <<EOF
Download Rapcha: ${LINK}

Version: ${VERSION_NAME} (versionCode ${VERSION_CODE})
SHA-256: ${SHA}
EOF
)"

          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" rapcha-lite.apk --clobber -R "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --title "Rapcha Lite ${VERSION_NAME}" --notes "$NOTES" --latest -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" rapcha-lite.apk --title "Rapcha Lite ${VERSION_NAME}" --notes "$NOTES" --latest -R "$GITHUB_REPOSITORY"
          fi

          {
            echo "### Rapcha Lite ${VERSION_NAME}"
            echo
            echo "- versionCode: ${VERSION_CODE}"
            echo "- versionName: ${VERSION_NAME}"
            echo "- size: ${SIZE} bytes"
            echo "- sha256: ${SHA}"
            echo "- cert SHA-256: ${CERT} (matches v27)"
            echo "- download: ${LINK}"
          } >> "$GITHUB_STEP_SUMMARY"
